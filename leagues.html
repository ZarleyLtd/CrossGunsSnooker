                }</style></noscript></head><body class="page-template"><header class="top js-header"><a class="logo" href="https://ZarleyLtd.github.io/CrossGunsSnooker/"><img src="https://ZarleyLtd.github.io/CrossGunsSnooker/media/website/crossgunslogo.png" alt="CrossGuns Snooker League" width="281" height="445"></a><nav class="navbar js-navbar"><button class="navbar__toggle js-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="navbar__toggle-box"><span class="navbar__toggle-inner">Menu</span></span></button><ul class="navbar__menu"><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/" target="_self">Home</a></li><li class="active"><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" target="_self">Results</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/top-breaks.html" target="_self">Top Breaks</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/handicaps.html" target="_self">Handicaps</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/rules.html" target="_self">Rules</a></li></ul></nav></header><main class="page"><article class="content"><div class="hero"><header class="hero__content hero__content--centered"><div class="wrapper"><h1>Leagues</h1></div></header><figure class="hero__image"><div class="hero__image-wrapper"><img src="https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/crossgunsbanner.png" srcset="https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-xs.png 640w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-sm.png 768w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-md.png 1024w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-lg.png 1366w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-xl.png 1600w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/7/responsive/crossgunsbanner-2xl.png 1920w" sizes="88vw" loading="eager" height="320" width="692" alt=""></div></figure></div><div class="entry-wrapper content__entry"><div class="standings-wrapper"><h2 class="standings-heading">Group 1</h2><pre id="league-a" class="league-standings" aria-label="Group 1 standings">Loading...</pre></div><div class="standings-wrapper"><h2 class="standings-heading">Group 2</h2><pre id="league-b" class="league-standings" aria-label="Group 2 standings">Loading...</pre></div><div class="standings-wrapper"><h2 class="standings-heading">Group 3</h2><pre id="league-c" class="league-standings" aria-label="Group 3 standings">Loading...</pre></div><p><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><script>document.addEventListener('DOMContentLoaded', function() {
    const standingsUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=902750162&single=true&output=csv";
    const fixturesUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=2003970244&single=true&output=csv";
    const handicapsUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=945321474&single=true&output=csv";
    const containerIds = ['league-a', 'league-b', 'league-c'];
    function showError(msg) {
      containerIds.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = msg;
      });
    }
    function parseCsv(url, options) {
      return new Promise((resolve, reject) => {
        Papa.parse(url, Object.assign({
          download: true,
          error: reject
        }, options, {
          complete: resolve
        }));
      });
    }
    function StringSafe(v) { return (v === undefined || v === null) ? '' : String(v).trim(); }
    function normalizeName(name) {
      return StringSafe(name).toLowerCase();
    }
    function parseIrishDate(str) {
      if (!str) return null;
      const parts = str.split('/');
      if (parts.length !== 3) return null;
      const [day, month, year] = parts.map(x => parseInt(x, 10));
      return new Date(year, month - 1, day);
    }
    function buildHandicapHistory(rows) {
      const handicapHistory = {};
      rows.forEach(row => {
        const name = row['Player Name']?.trim();
        const hcap = parseInt(row['Handicap'] || '0', 10);
        const dateStr = row['Handicap Date']?.trim();
        if (!name || !dateStr) return;
        const date = new Date(dateStr);
        const key = normalizeName(name);
        if (!handicapHistory[key]) handicapHistory[key] = [];
        handicapHistory[key].push({ date, handicap: hcap });
      });
      for (const key in handicapHistory) {
        handicapHistory[key].sort((a, b) => a.date - b.date);
      }
      return handicapHistory;
    }
    function getHandicapForDate(player, matchDate, handicapHistory) {
      const list = handicapHistory[normalizeName(player)];
      if (!list || list.length === 0) return 0;
      if (!matchDate) return list[0].handicap;
      let chosen = list[0].handicap;
      for (let i = 0; i < list.length; i++) {
        if (list[i].date <= matchDate) {
          chosen = list[i].handicap;
        } else {
          break;
        }
      }
      return chosen;
    }
    function buildMaxBreakMap(fixtureRows, handicapHistory) {
      const maxBreakByPlayer = {};
      fixtureRows.forEach(r => {
        const playerA = StringSafe(r['Player A']);
        const playerB = StringSafe(r['Player B']);
        const league = StringSafe(r['League']);
        if (!league) return;
        const matchDate = parseIrishDate(r['Match Date']);
        const aBreaks = (r['aBreaks'] || '').split(',').map(x => x.trim());
        const bBreaks = (r['bBreaks'] || '').split(',').map(x => x.trim());
        aBreaks.forEach(b => {
          const n = parseInt(b, 10);
          if (!isNaN(n) && n >= 25) {
            const adj = n + Math.max(0, getHandicapForDate(playerA, matchDate, handicapHistory));
            const key = league + '|' + normalizeName(playerA);
            if (!maxBreakByPlayer[key] || adj > maxBreakByPlayer[key]) {
              maxBreakByPlayer[key] = adj;
            }
          }
        });
        bBreaks.forEach(b => {
          const n = parseInt(b, 10);
          if (!isNaN(n) && n >= 25) {
            const adj = n + Math.max(0, getHandicapForDate(playerB, matchDate, handicapHistory));
            const key = league + '|' + normalizeName(playerB);
            if (!maxBreakByPlayer[key] || adj > maxBreakByPlayer[key]) {
              maxBreakByPlayer[key] = adj;
            }
          }
        });
      });
      return maxBreakByPlayer;
    }
    function getCompletedFixtures(fixtureRows) {
      return fixtureRows.filter(r =>
        r['Player A'] && r['Player B'] && r['Result'] && StringSafe(r['Result']) !== ''
      );
    }
    const h2hCache = new Map();
    function getH2H(nameA, nameB, leagueKey, fixtures) {
      const keyA = normalizeName(nameA);
      const keyB = normalizeName(nameB);
      const cacheKey = leagueKey + '|' + [keyA, keyB].sort().join('|');
      if (h2hCache.has(cacheKey)) return h2hCache.get(cacheKey);
      let matchWinsA = 0, matchWinsB = 0, framesA = 0, framesB = 0;
      fixtures.forEach(match => {
        if (StringSafe(match['League']) !== leagueKey) return;
        const pa = normalizeName(match['Player A']);
        const pb = normalizeName(match['Player B']);
        const isPair =
          (pa === keyA && pb === keyB) || (pa === keyB && pb === keyA);
        if (!isPair) return;
        const parts = StringSafe(match['Result']).split('-');
        if (parts.length < 2) return;
        const scoreSheetA = parseInt(parts[0].trim(), 10);
        const scoreSheetB = parseInt(parts[1].trim(), 10);
        if (isNaN(scoreSheetA) || isNaN(scoreSheetB)) return;
        let aFrames, bFrames;
        if (pa === keyA) {
          aFrames = scoreSheetA;
          bFrames = scoreSheetB;
        } else {
          aFrames = scoreSheetB;
          bFrames = scoreSheetA;
        }
        framesA += aFrames;
        framesB += bFrames;
        if (aFrames > bFrames) matchWinsA++;
        else if (bFrames > aFrames) matchWinsB++;
      });
      const stats = { matchWinsA, matchWinsB, framesA, framesB };
      h2hCache.set(cacheKey, stats);
      return stats;
    }
    const toInt = v => { const n = parseInt(v, 10); return isNaN(n) ? -Infinity : n; };
    function getMaxBreak(playerName, leagueKey, maxBreakByPlayer) {
      const key = leagueKey + '|' + normalizeName(playerName);
      const val = maxBreakByPlayer[key];
      return val === undefined ? -Infinity : val;
    }
    function makeSortFn(leagueKey, fixtures, maxBreakByPlayer) {
      return (a, b) => {
        if (toInt(b.Pts) !== toInt(a.Pts)) return toInt(b.Pts) - toInt(a.Pts);
        if (toInt(b['+/-']) !== toInt(a['+/-'])) return toInt(b['+/-']) - toInt(a['+/-']);
        if (toInt(b.W) !== toInt(a.W)) return toInt(b.W) - toInt(a.W);
        const h2h = getH2H(a['Player Name'], b['Player Name'], leagueKey, fixtures);
        if (h2h.matchWinsB !== h2h.matchWinsA) return h2h.matchWinsB - h2h.matchWinsA;
        if (h2h.framesB !== h2h.framesA) return h2h.framesB - h2h.framesA;
        const breakB = getMaxBreak(b['Player Name'], leagueKey, maxBreakByPlayer);
        const breakA = getMaxBreak(a['Player Name'], leagueKey, maxBreakByPlayer);
        return breakB - breakA;
      };
    }
    function padRight(str, width) { str = StringSafe(str); return str.length >= width ? str : str + ' '.repeat(width - str.length); }
    function padLeft(str, width) { str = StringSafe(str); return str.length >= width ? str : ' '.repeat(width - str.length) + str; }
    function truncateName(name) {
      name = StringSafe(name);
      return (name.length > 16) ? name.slice(0, 14) + '..' : name;
    }
    function buildText(containerId, league, sortFn) {
      const container = document.getElementById(containerId);
      if (!container) return;
      if (league.length === 0) { container.textContent = 'No players.'; return; }
      const rankWidth = 2;
      const nameWidth = 16;
      const pWidth = 2, wWidth = 2, lWidth = 2, pmWidth = 3, ptsWidth = 3;
      const header = [padLeft('#', rankWidth), padRight('Player Name', nameWidth), padLeft('P', pWidth),
        padLeft('W', wWidth), padLeft('L', lWidth), padLeft('+/-', pmWidth), padLeft('Pts', ptsWidth)].join(' ');
      const sep = '-'.repeat(header.length);
      const lines = [header, sep];
      let lastRank = 0;
      league.forEach((p, idx) => {
        let rank;
        if (idx > 0 && sortFn(league[idx - 1], p) === 0) {
          rank = lastRank;
        } else {
          rank = idx + 1;
          lastRank = rank;
        }
        const row = [
          padLeft(rank, rankWidth),
          padRight(truncateName(p['Player Name']), nameWidth),
          padLeft(p.P, pWidth),
          padLeft(p.W, wWidth),
          padLeft(p.L, lWidth),
          padLeft(p['+/-'], pmWidth),
          padLeft(p.Pts, ptsWidth)
        ].join(' ');
        lines.push(row);
      });
      container.textContent = lines.join('\n');
    }
    Promise.all([
      parseCsv(standingsUrl, { skipEmptyLines: true }),
      parseCsv(fixturesUrl, { header: true, skipEmptyLines: true }),
      parseCsv(handicapsUrl, { header: true, skipEmptyLines: true })
    ]).then(([standingsResult, fixturesResult, handicapsResult]) => {
      h2hCache.clear();
      const dataRows = standingsResult.data.slice(3);
      const leagueA = [];
      const leagueB = [];
      const leagueC = [];
      dataRows.forEach(row => {
        if (row[0] && row[0].trim()) {
          leagueA.push({ 'Player Name': row[0].trim(), P: row[1] || '', W: row[2] || '', L: row[3] || '', '+/-': row[4] || '', Pts: row[5] || '' });
        }
        if (row[7] && row[7].trim()) {
          leagueB.push({ 'Player Name': row[7].trim(), P: row[8] || '', W: row[9] || '', L: row[10] || '', '+/-': row[11] || '', Pts: row[12] || '' });
        }
        if (row[14] && row[14].trim()) {
          leagueC.push({ 'Player Name': row[14].trim(), P: row[15] || '', W: row[16] || '', L: row[17] || '', '+/-': row[18] || '', Pts: row[19] || '' });
        }
      });
      const handicapHistory = buildHandicapHistory(handicapsResult.data);
      const completedFixtures = getCompletedFixtures(fixturesResult.data);
      const maxBreakByPlayer = buildMaxBreakMap(fixturesResult.data, handicapHistory);
      const sortA = makeSortFn('One', completedFixtures, maxBreakByPlayer);
      const sortB = makeSortFn('Two', completedFixtures, maxBreakByPlayer);
      const sortC = makeSortFn('Three', completedFixtures, maxBreakByPlayer);
      leagueA.sort(sortA);
      leagueB.sort(sortB);
      leagueC.sort(sortC);
      buildText('league-a', leagueA, sortA);
      buildText('league-b', leagueB, sortB);
      buildText('league-c', leagueC, sortC);
    }).catch(err => {
      console.error('Error loading standings data:', err);
      showError('Error loading standings.');
    });
  });</script></p></div></article></main><footer class="footer"><div class="wrapper"><nav class="footer__nav"><ul><li class="active"><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" class="al" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" class="al" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" class="al" target="_self">Results</a></li></ul></nav><div class="footer__copyright"><p><span style="color: #169179;">by JP</span></p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/js/scripts.min.js?v=700105c316933a8202041b6415abb233"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'overlay',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
