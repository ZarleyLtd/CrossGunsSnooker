          document.documentElement.classList.add('crossguns-knockout-comp');

      } catch (e) {}

    <noscript><style>img[loading] { opacity: 1; }</style></noscript>
    <script src="assets/js/config/app-config.js"></script>
    <script src="assets/js/utils/api-client.js"></script>
    <script src="assets/js/utils/current-competition.js"></script>

    <header class="top js-header">
      <a class="logo" href="index.html">
        <img src="assets/images/crossguns-logo.png" alt="CrossGuns Snooker League" width="281" height="445">
      </a>
      <nav class="navbar js-navbar">
        <button class="navbar__toggle js-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
          <span class="navbar__toggle-box">
            <span class="navbar__toggle-inner">Menu</span>
          </span>
        </button>
        <ul class="navbar__menu">
          <li><a href="index.html" target="_self">Home</a></li>
          <li class="nav-item-standings"><a href="leagues.html" target="_self" class="nav-standings-link">Leagues</a></li>
          <li class="active"><a href="fixtures.html" target="_self">Fixtures</a></li>
          <li><a href="results.html" target="_self">Results</a></li>
          <li><a href="top-breaks.html" target="_self">Top Breaks</a></li>
          <li><a href="handicaps.html" target="_self">Handicaps</a></li>
          <li><a href="rules.html" target="_self">Rules</a></li>
          <li>
            <button type="button" class="nav-admin-toggle" id="nav-admin-mode-toggle">Unlock Admin Mode</button>
          </li>
          <li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-competitions.html" target="_self">Manage Comps</a></li><li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-players.html" target="_self">Manage Players</a></li><li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-fixtures.html" target="_self">Manage Fixtures</a></li><li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-passcodes.html" target="_self">Manage Passcodes</a></li><li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-bulk-players.html" target="_self">Bulk Load Players</a></li><li class="nav-admin-only" hidden aria-hidden="true"><a href="admin-bulk-fixtures.html" target="_self">Bulk Load Fixtures</a></li>
        </ul>
      </nav>
    </header>
    <main class="page">
      <article class="content">
        <div class="hero">
          <header class="hero__content hero__content--centered">
            <div class="wrapper"><h1>Fixtures</h1></div>
          </header>
          <figure class="hero__image">
            <div class="hero__image-wrapper">
              <img src="assets/images/crossguns-hero.png" loading="eager" height="320" width="692" alt="CrossGuns Snooker League" />
            </div>
          </figure>
        </div>
        <div class="entry-wrapper content__entry">
          <p id="page-competition-name" class="align-center" style="color:#169179;font-weight:600;margin-bottom:1rem;"></p>
          <div id="filter-container" class="league-filter" hidden aria-label="Filter by group"></div>
          <div id="fixtures-list" style="text-align: center; margin: 0 auto; max-width: 600px"></div>
          <p class="align-right"></p>

          <dialog id="fixture-result-dialog" class="fixture-result-dialog" aria-labelledby="fixture-result-title">
            <form id="fixture-result-form" class="fixture-result-form">
              <h2 id="fixture-result-title" class="fixture-result-dialog__heading">Enter result</h2>
              <p id="fixture-result-entered-by" class="fixture-result-entered-by" hidden></p>
              <input type="hidden" id="fixture-result-fixture-id" />
              <input type="hidden" id="fixture-result-player-a-id" />
              <input type="hidden" id="fixture-result-player-b-id" />
              <p class="fixture-result-date-row">
                <label for="fixture-result-date">Match date</label>
                <span class="fixture-result-date-controls">
                  <input type="text" id="fixture-result-date" required placeholder="31 Jan 2026" inputmode="text" autocomplete="off" spellcheck="false" />
                  <input type="date" id="fixture-result-date-picker" class="fixture-result-date-picker" aria-label="Choose match date" />
                </span>
              </p>
              <div class="fixture-result-player-block">
                <div id="fixture-result-label-a" class="fixture-result-player-name"></div>
                <div class="fixture-result-score-controls">
                  <div id="fixture-frame-racks-a" class="fixture-frame-racks-host" data-frame-racks-for="a" role="group" aria-label="Frames scored"></div>
                  <div class="fixture-frame-score-num" id="fixture-result-score-a-display">0</div>
                  <input type="hidden" id="fixture-result-score-a" value="0" />
                </div>
                <div class="fixture-breaks-entry fixture-breaks-entry--indented">
                  <div class="fixture-breaks-entry__meta">
                    <label for="fixture-breaks-field-a" class="fixture-breaks-entry__label">Breaks:</label>
                  </div>
                  <input type="text" id="fixture-breaks-field-a" class="fixture-breaks-entry__input" autocomplete="off" spellcheck="false" placeholder="e.g. 32, 47" />
                </div>
              </div>
              <div class="fixture-result-player-block">
                <div id="fixture-result-label-b" class="fixture-result-player-name"></div>
                <div class="fixture-result-score-controls">
                  <div id="fixture-frame-racks-b" class="fixture-frame-racks-host" data-frame-racks-for="b" role="group" aria-label="Frames scored"></div>
                  <div class="fixture-frame-score-num" id="fixture-result-score-b-display">0</div>
                  <input type="hidden" id="fixture-result-score-b" value="0" />
                </div>
                <div class="fixture-breaks-entry fixture-breaks-entry--indented">
                  <div class="fixture-breaks-entry__meta">
                    <label for="fixture-breaks-field-b" class="fixture-breaks-entry__label">Breaks:</label>
                  </div>
                  <input type="text" id="fixture-breaks-field-b" class="fixture-breaks-entry__input" autocomplete="off" spellcheck="false" placeholder="e.g. 32, 47" />
                </div>
              </div>
              <p id="fixture-result-msg" class="msg" hidden></p>
              <div class="fixture-result-actions">
                <button type="submit" class="btn fixture-result-btn fixture-result-btn--save" id="fixture-result-save"><span class="fixture-result-btn__text">Save</span></button>
                <button type="button" id="fixture-result-slip-btn" class="result-slip-btn" aria-label="Result slip photo"></button>
                <button type="button" class="btn fixture-result-btn fixture-result-btn--cancel" id="fixture-result-cancel"><span class="fixture-result-btn__text">Cancel</span></button>
              </div>
            </form>
          </dialog>
        </div>
      </article>
    </main>
    <footer class="footer">
      <div class="wrapper">
        <nav class="footer__nav">
          <ul>
            <li><a href="leagues.html" class="al footer-standings-link" target="_self">Leagues</a></li>
            <li><a href="fixtures.html" class="al" target="_self">Fixtures</a></li>
            <li><a href="results.html" class="al" target="_self">Results</a></li>

        <div class="footer__copyright"><p><span style="color: #169179;">by JP</span></p></div>
        <button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path d="M8 6L12 2L16 6" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 2V22" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </footer>
    <script defer="defer" src="assets/js/scripts.min.js"></script>

      window.themeMenuConfig = {
        mobileMenuMode: "overlay",

        submenuWidth: "auto",

        mobileMenuExpandableSubmenus: true,
        relatedContainerForOverlayMenuSelector: ".top",

    <script src="assets/js/utils/nav-active.js"></script>
