                }</style></noscript></head><body class="page-template"><header class="top js-header"><a class="logo" href="https://ZarleyLtd.github.io/CrossGunsSnooker/"><img src="https://ZarleyLtd.github.io/CrossGunsSnooker/media/website/crossgunslogo.png" alt="CrossGuns Snooker League" width="281" height="445"></a><nav class="navbar js-navbar"><button class="navbar__toggle js-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="navbar__toggle-box"><span class="navbar__toggle-inner">Menu</span></span></button><ul class="navbar__menu"><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/" target="_self">Home</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" target="_self">Results</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/top-breaks.html" target="_self">Top Breaks</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/handicaps.html" target="_self">Handicaps</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/rules.html" target="_self">Rules</a></li></ul></nav></header><main class="page"><article class="content"><div class="hero hero--noimage"><header class="hero__content hero__content--centered"><div class="wrapper"><h1>backup page</h1></div></header></div><div class="entry-wrapper content__entry"><section class="hero hero--image"><h2 class="align-center"><span style="color: #169179;">Spring League '26</span></h2><p class="align-center">League stage — current leaders</p><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 1</span></h3><h3 class="align-center"><span id="g1-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 2</span></h3><h3 class="align-center"><span id="g2-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 3</span></h3><h3 class="align-center"><span id="g3-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div></section><p><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><script>document.addEventListener('DOMContentLoaded', function() {
  var sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=902750162&single=true&output=csv";

  function rowLooksLikeKnockoutSection(row) {
    var check = [row[0], row[7], row[14]];
    for (var i = 0; i < check.length; i++) {
      var t = (check[i] || '').trim().toLowerCase();
      if (!t) continue;
      if (/\bknockout\b|\bko\b|\bsemi\b|semi\-final|quarter|playoff|\bfinals?\b/.test(t)) return true;
    }
    return false;
  }

  var toInt = function(v) { var n = parseInt(v, 10); return isNaN(n) ? -Infinity : n; };

  var sortFn = function(a, b) {
    if (toInt(b.Pts) !== toInt(a.Pts)) return toInt(b.Pts) - toInt(a.Pts);
    if (toInt(b['+/-']) !== toInt(a['+/-'])) return toInt(b['+/-']) - toInt(a['+/-']);
    return toInt(b.W) - toInt(a.W);
  };

  function getTopPlayers(league) {
    if (league.length === 0) return 'N/A';
    league.sort(sortFn);
    var top = league[0];
    var pts = toInt(top.Pts);
    var pm = toInt(top['+/-']);
    var w = toInt(top.W);
    var names = league.filter(function(p) {
      return toInt(p.Pts) === pts && toInt(p['+/-']) === pm && toInt(p.W) === w;
    }).map(function(p) { return p['Player Name']; });
    if (names.length === 1) return names[0];
    return names.join(' & ') + ' (tied)';
  }

  Papa.parse(sheetUrl, {
    download: true,
    skipEmptyLines: true,
    complete: function(results) {
      var dataRows = results.data.slice(3);
      var leagueA = [];
      var leagueB = [];
      var leagueC = [];

      for (var r = 0; r < dataRows.length; r++) {
        var row = dataRows[r];
        if (rowLooksLikeKnockoutSection(row)) break;

        if (row[0] && row[0].trim()) {
          leagueA.push({
            'Player Name': row[0].trim(),
            P: row[1] || '',
            W: row[2] || '',
            L: row[3] || '',
            '+/-': row[4] || '',
            Pts: row[5] || ''
          });
        }
        if (row[7] && row[7].trim()) {
          leagueB.push({
            'Player Name': row[7].trim(),
            P: row[8] || '',
            W: row[9] || '',
            L: row[10] || '',
            '+/-': row[11] || '',
            Pts: row[12] || ''
          });
        }
        if (row[14] && row[14].trim()) {
          leagueC.push({
            'Player Name': row[14].trim(),
            P: row[15] || '',
            W: row[16] || '',
            L: row[17] || '',
            '+/-': row[18] || '',
            Pts: row[19] || ''
          });
        }
      }

      var el1 = document.getElementById('g1-leader');
      var el2 = document.getElementById('g2-leader');
      var el3 = document.getElementById('g3-leader');
      if (el1) el1.textContent = getTopPlayers(leagueA);
      if (el2) el2.textContent = getTopPlayers(leagueB);
      if (el3) el3.textContent = getTopPlayers(leagueC);
    },
    error: function(err) {
      console.error('Error loading CSV:', err);
    }
  });
});</script></p><div class="standings-wrapper"><h2 class="standings-heading">Group 1</h2><pre id="league-a" class="league-standings" aria-label="Group 1 standings"></pre></div><div class="standings-wrapper"><h2 class="standings-heading">Group 2</h2><pre id="league-b" class="league-standings" aria-label="Group 2 standings"></pre></div><div class="standings-wrapper"><h2 class="standings-heading">Group 3</h2><pre id="league-c" class="league-standings" aria-label="Group 3 standings"></pre></div><p><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><script>document.addEventListener('DOMContentLoaded', function() {
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=902750162&single=true&output=csv";
  
    Papa.parse(sheetUrl, {
      download: true,
      skipEmptyLines: true,
      complete: function(results) {
        const dataRows = results.data.slice(3);
        const leagueA = [];
        const leagueB = [];
        const leagueC = [];

        // LeagueStandings sheet: block 1 col A (0), block 2 col H (7), block 3 col O (14)
        dataRows.forEach(row => {
          if (row[0] && row[0].trim()) {
            leagueA.push({ 'Player Name': row[0].trim(), P: row[1]||'', W: row[2]||'', L: row[3]||'', '+/-': row[4]||'', Pts: row[5]||'' });
          }
          if (row[7] && row[7].trim()) {
            leagueB.push({ 'Player Name': row[7].trim(), P: row[8]||'', W: row[9]||'', L: row[10]||'', '+/-': row[11]||'', Pts: row[12]||'' });
          }
          if (row[14] && row[14].trim()) {
            leagueC.push({ 'Player Name': row[14].trim(), P: row[15]||'', W: row[16]||'', L: row[17]||'', '+/-': row[18]||'', Pts: row[19]||'' });
          }
        });
  
        const toInt = v => { const n = parseInt(v, 10); return isNaN(n) ? -Infinity : n; };
  
        // --- UPDATED SORTING FUNCTION ---
        const sortFn = (a, b) => {
          // 1. Points (Frames Won)
          if (toInt(b.Pts) !== toInt(a.Pts)) return toInt(b.Pts) - toInt(a.Pts);
          // 2. Frame Difference (+/-)
          if (toInt(b['+/-']) !== toInt(a['+/-'])) return toInt(b['+/-']) - toInt(a['+/-']);
          // 3. Matches Won (The 'W' column)
          return toInt(b.W) - toInt(a.W);
          
          // Note: Head-to-Head would go here, but requires match-level data.
        };
  
        leagueA.sort(sortFn);
        leagueB.sort(sortFn);
        leagueC.sort(sortFn);
  
        function StringSafe(v) { return (v===undefined||v===null)?'':String(v).trim(); }
        function padRight(str, width) { str=StringSafe(str); return str.length>=width?str:str+" ".repeat(width-str.length); }
        function padLeft(str, width) { str=StringSafe(str); return str.length>=width?str:" ".repeat(width-str.length)+str; }
  
        function truncateName(name) {
          name = StringSafe(name);
          return (name.length>16)?name.slice(0,14)+'..':name;
        }
  
        function buildText(containerId, league) {
          const container = document.getElementById(containerId);
          if (!container) return;
          if (league.length === 0) { container.textContent="No players."; return; }
  
          const rankWidth = 2;
          const nameWidth = 16; 
          const pWidth=2, wWidth=2, lWidth=2, pmWidth=3, ptsWidth=3;
  
          const header = [padLeft('#', rankWidth), padRight('Player Name', nameWidth), padLeft('P',pWidth),
                          padLeft('W',wWidth), padLeft('L',lWidth), padLeft('+/-',pmWidth), padLeft('Pts',ptsWidth)].join(' ');
          const sep = '-'.repeat(header.length);
          const lines = [header, sep];
  
          // Track variables for tie-breaking in the rank display
          let lastPts = null, lastPM = null, lastW = null, lastRank = 0;
  
          league.forEach((p, idx) => {
            const pts = toInt(p.Pts);
            const pm = toInt(p['+/-']);
            const w = toInt(p.W);
            
            let rank;
            // --- UPDATED RANKING DISPLAY LOGIC ---
            // If all three stats are identical, they share a rank number
            if (pts === lastPts && pm === lastPM && w === lastW) {
              rank = lastRank; 
            } else {
              rank = idx + 1;
              lastRank = rank;
              lastPts = pts;
              lastPM = pm;
              lastW = w;
            }
  
            const row = [
              padLeft(rank, rankWidth),
              padRight(truncateName(p['Player Name']), nameWidth),
              padLeft(p.P,pWidth),
              padLeft(p.W,wWidth),
              padLeft(p.L,lWidth),
              padLeft(p['+/-'],pmWidth),
              padLeft(p.Pts,ptsWidth)
            ].join(' ');
  
            lines.push(row);
          });
  
          container.textContent = lines.join("\n");
        }
  
        buildText('league-a', leagueA);
        buildText('league-b', leagueB);
        buildText('league-c', leagueC);
      }
    });
  });</script></p></div></article></main><footer class="footer"><div class="wrapper"><nav class="footer__nav"><ul><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" class="al" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" class="al" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" class="al" target="_self">Results</a></li></ul></nav><div class="footer__copyright"><p><span style="color: #169179;">by JP</span></p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/js/scripts.min.js?v=700105c316933a8202041b6415abb233"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'overlay',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
