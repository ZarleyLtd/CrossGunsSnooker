                }</style></noscript></head><body class="page-template"><header class="top js-header"><a class="logo" href="https://ZarleyLtd.github.io/CrossGunsSnooker/"><img src="https://ZarleyLtd.github.io/CrossGunsSnooker/media/website/crossgunslogo.png" alt="CrossGuns Snooker League" width="281" height="445"></a><nav class="navbar js-navbar"><button class="navbar__toggle js-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="navbar__toggle-box"><span class="navbar__toggle-inner">Menu</span></span></button><ul class="navbar__menu"><li class="active"><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/" target="_self">Home</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" target="_self">Results</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/top-breaks.html" target="_self">Top Breaks</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/handicaps.html" target="_self">Handicaps</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/rules.html" target="_self">Rules</a></li></ul></nav></header><main class="page"><article class="content"><div class="hero"><header class="hero__content hero__content--centered"><div class="wrapper"><h1>Crossguns Snooker League</h1></div></header><figure class="hero__image"><div class="hero__image-wrapper"><img src="https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/crossgunsbanner-2.png" srcset="https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-xs.png 640w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-sm.png 768w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-md.png 1024w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-lg.png 1366w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-xl.png 1600w, https://ZarleyLtd.github.io/CrossGunsSnooker/media/posts/6/responsive/crossgunsbanner-2-2xl.png 1920w" sizes="88vw" loading="eager" height="320" width="692" alt=""></div></figure></div><div class="entry-wrapper content__entry"><section class="hero hero--image"><h2 class="align-center"><span style="color: #169179;">Spring League '26</span></h2><p class="align-center">League stage — current leaders</p><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 1</span></h3><h3 class="align-center"><span id="g1-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 2</span></h3><h3 class="align-center"><span id="g2-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div><div class="home-leader-group"><h3 class="align-center"><span style="color: #169179;">Group 3</span></h3><h3 class="align-center"><span id="g3-leader" style="color: #fff; font-size: 1.2em;">—</span></h3></div></section><p><script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script><script>document.addEventListener('DOMContentLoaded', function() {
  var standingsUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=902750162&single=true&output=csv";
  var fixturesUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=2003970244&single=true&output=csv";
  var handicapsUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD5fxz45LksV_LJgjEdWpFSHeLNHRmxLc9NKBj8P7xun1822ltfPVM2bbGfUrjtyfZwRNSjGxlnyY6/pub?gid=945321474&single=true&output=csv";

  var leaderIds = ['g1-leader', 'g2-leader', 'g3-leader'];

  function showLeaderError(msg) {
    leaderIds.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = msg;
    });
  }

  function parseCsv(url, options) {
    return new Promise(function(resolve, reject) {
      Papa.parse(url, Object.assign({
        download: true,
        error: reject
      }, options, {
        complete: resolve
      }));
    });
  }

  function StringSafe(v) { return (v === undefined || v === null) ? '' : String(v).trim(); }

  function normalizeName(name) {
    return StringSafe(name).toLowerCase();
  }

  function parseIrishDate(str) {
    if (!str) return null;
    var parts = str.split('/');
    if (parts.length !== 3) return null;
    var day = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10);
    var year = parseInt(parts[2], 10);
    return new Date(year, month - 1, day);
  }

  function buildHandicapHistory(rows) {
    var handicapHistory = {};
    rows.forEach(function(row) {
      var name = row['Player Name'] ? row['Player Name'].trim() : '';
      var hcap = parseInt(row['Handicap'] || '0', 10);
      var dateStr = row['Handicap Date'] ? row['Handicap Date'].trim() : '';
      if (!name || !dateStr) return;
      var date = new Date(dateStr);
      var key = normalizeName(name);
      if (!handicapHistory[key]) handicapHistory[key] = [];
      handicapHistory[key].push({ date: date, handicap: hcap });
    });
    for (var key in handicapHistory) {
      handicapHistory[key].sort(function(a, b) { return a.date - b.date; });
    }
    return handicapHistory;
  }

  function getHandicapForDate(player, matchDate, handicapHistory) {
    var list = handicapHistory[normalizeName(player)];
    if (!list || list.length === 0) return 0;
    if (!matchDate) return list[0].handicap;
    var chosen = list[0].handicap;
    for (var i = 0; i < list.length; i++) {
      if (list[i].date <= matchDate) {
        chosen = list[i].handicap;
      } else {
        break;
      }
    }
    return chosen;
  }

  function buildMaxBreakMap(fixtureRows, handicapHistory) {
    var maxBreakByPlayer = {};
    fixtureRows.forEach(function(r) {
      var playerA = StringSafe(r['Player A']);
      var playerB = StringSafe(r['Player B']);
      var league = StringSafe(r['League']);
      if (!league) return;
      var matchDate = parseIrishDate(r['Match Date']);
      var aBreaks = (r['aBreaks'] || '').split(',').map(function(x) { return x.trim(); });
      var bBreaks = (r['bBreaks'] || '').split(',').map(function(x) { return x.trim(); });

      aBreaks.forEach(function(b) {
        var n = parseInt(b, 10);
        if (!isNaN(n) && n >= 25) {
          var adj = n + Math.max(0, getHandicapForDate(playerA, matchDate, handicapHistory));
          var key = league + '|' + normalizeName(playerA);
          if (!maxBreakByPlayer[key] || adj > maxBreakByPlayer[key]) {
            maxBreakByPlayer[key] = adj;
          }
        }
      });

      bBreaks.forEach(function(b) {
        var n = parseInt(b, 10);
        if (!isNaN(n) && n >= 25) {
          var adj = n + Math.max(0, getHandicapForDate(playerB, matchDate, handicapHistory));
          var key = league + '|' + normalizeName(playerB);
          if (!maxBreakByPlayer[key] || adj > maxBreakByPlayer[key]) {
            maxBreakByPlayer[key] = adj;
          }
        }
      });
    });
    return maxBreakByPlayer;
  }

  function getCompletedFixtures(fixtureRows) {
    return fixtureRows.filter(function(r) {
      return r['Player A'] && r['Player B'] && r['Result'] && StringSafe(r['Result']) !== '';
    });
  }

  var h2hCache = new Map();

  function getH2H(nameA, nameB, leagueKey, fixtures) {
    var keyA = normalizeName(nameA);
    var keyB = normalizeName(nameB);
    var cacheKey = leagueKey + '|' + [keyA, keyB].sort().join('|');
    if (h2hCache.has(cacheKey)) return h2hCache.get(cacheKey);

    var matchWinsA = 0, matchWinsB = 0, framesA = 0, framesB = 0;

    fixtures.forEach(function(match) {
      if (StringSafe(match['League']) !== leagueKey) return;
      var pa = normalizeName(match['Player A']);
      var pb = normalizeName(match['Player B']);
      var isPair = (pa === keyA && pb === keyB) || (pa === keyB && pb === keyA);
      if (!isPair) return;

      var parts = StringSafe(match['Result']).split('-');
      if (parts.length < 2) return;
      var scoreSheetA = parseInt(parts[0].trim(), 10);
      var scoreSheetB = parseInt(parts[1].trim(), 10);
      if (isNaN(scoreSheetA) || isNaN(scoreSheetB)) return;

      var aFrames, bFrames;
      if (pa === keyA) {
        aFrames = scoreSheetA;
        bFrames = scoreSheetB;
      } else {
        aFrames = scoreSheetB;
        bFrames = scoreSheetA;
      }
      framesA += aFrames;
      framesB += bFrames;
      if (aFrames > bFrames) matchWinsA++;
      else if (bFrames > aFrames) matchWinsB++;
    });

    var stats = { matchWinsA: matchWinsA, matchWinsB: matchWinsB, framesA: framesA, framesB: framesB };
    h2hCache.set(cacheKey, stats);
    return stats;
  }

  var toInt = function(v) { var n = parseInt(v, 10); return isNaN(n) ? -Infinity : n; };

  function getMaxBreak(playerName, leagueKey, maxBreakByPlayer) {
    var key = leagueKey + '|' + normalizeName(playerName);
    var val = maxBreakByPlayer[key];
    return val === undefined ? -Infinity : val;
  }

  function makeSortFn(leagueKey, fixtures, maxBreakByPlayer) {
    return function(a, b) {
      if (normalizeName(a['Player Name']) === normalizeName(b['Player Name'])) return 0;
      if (toInt(b.Pts) !== toInt(a.Pts)) return toInt(b.Pts) - toInt(a.Pts);
      if (toInt(b['+/-']) !== toInt(a['+/-'])) return toInt(b['+/-']) - toInt(a['+/-']);
      if (toInt(b.W) !== toInt(a.W)) return toInt(b.W) - toInt(a.W);

      var h2h = getH2H(a['Player Name'], b['Player Name'], leagueKey, fixtures);
      if (h2h.matchWinsB !== h2h.matchWinsA) return h2h.matchWinsB - h2h.matchWinsA;
      if (h2h.framesB !== h2h.framesA) return h2h.framesB - h2h.framesA;

      var breakB = getMaxBreak(b['Player Name'], leagueKey, maxBreakByPlayer);
      var breakA = getMaxBreak(a['Player Name'], leagueKey, maxBreakByPlayer);
      if (breakB === breakA) return 0;
      return breakB - breakA;
    };
  }

  function rowLooksLikeKnockoutSection(row) {
    var check = [row[0], row[7], row[14]];
    for (var i = 0; i < check.length; i++) {
      var t = (check[i] || '').trim().toLowerCase();
      if (!t) continue;
      if (/\bknockout\b|\bko\b|\bsemi\b|semi\-final|quarter|playoff|\bfinals?\b/.test(t)) return true;
    }
    return false;
  }

  function getTopPlayers(league, sortFn) {
    if (league.length === 0) return 'N/A';
    league.sort(sortFn);
    var names = [league[0]['Player Name']];
    for (var i = 1; i < league.length; i++) {
      if (sortFn(league[i - 1], league[i]) === 0) {
        names.push(league[i]['Player Name']);
      } else {
        break;
      }
    }
    if (names.length === 1) return names[0];
    return names.join(' & ') + ' (tied)';
  }

  Promise.all([
    parseCsv(standingsUrl, { skipEmptyLines: true }),
    parseCsv(fixturesUrl, { header: true, skipEmptyLines: true }),
    parseCsv(handicapsUrl, { header: true, skipEmptyLines: true })
  ]).then(function(results) {
    h2hCache.clear();

    var standingsResult = results[0];
    var fixturesResult = results[1];
    var handicapsResult = results[2];

    var dataRows = standingsResult.data.slice(3);
    var leagueA = [];
    var leagueB = [];
    var leagueC = [];

    for (var r = 0; r < dataRows.length; r++) {
      var row = dataRows[r];
      if (rowLooksLikeKnockoutSection(row)) break;

      if (row[0] && row[0].trim()) {
        leagueA.push({
          'Player Name': row[0].trim(),
          P: row[1] || '',
          W: row[2] || '',
          L: row[3] || '',
          '+/-': row[4] || '',
          Pts: row[5] || ''
        });
      }
      if (row[7] && row[7].trim()) {
        leagueB.push({
          'Player Name': row[7].trim(),
          P: row[8] || '',
          W: row[9] || '',
          L: row[10] || '',
          '+/-': row[11] || '',
          Pts: row[12] || ''
        });
      }
      if (row[14] && row[14].trim()) {
        leagueC.push({
          'Player Name': row[14].trim(),
          P: row[15] || '',
          W: row[16] || '',
          L: row[17] || '',
          '+/-': row[18] || '',
          Pts: row[19] || ''
        });
      }
    }

    var handicapHistory = buildHandicapHistory(handicapsResult.data);
    var completedFixtures = getCompletedFixtures(fixturesResult.data);
    var maxBreakByPlayer = buildMaxBreakMap(fixturesResult.data, handicapHistory);

    var sortA = makeSortFn('One', completedFixtures, maxBreakByPlayer);
    var sortB = makeSortFn('Two', completedFixtures, maxBreakByPlayer);
    var sortC = makeSortFn('Three', completedFixtures, maxBreakByPlayer);

    var el1 = document.getElementById('g1-leader');
    var el2 = document.getElementById('g2-leader');
    var el3 = document.getElementById('g3-leader');
    if (el1) el1.textContent = getTopPlayers(leagueA, sortA);
    if (el2) el2.textContent = getTopPlayers(leagueB, sortB);
    if (el3) el3.textContent = getTopPlayers(leagueC, sortC);
  }).catch(function(err) {
    console.error('Error loading leader data:', err);
    showLeaderError('Error loading leaders.');
  });
});</script></p></div></article></main><footer class="footer"><div class="wrapper"><nav class="footer__nav"><ul><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/leagues.html" class="al" target="_self">Leagues</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/fixtures.html" class="al" target="_self">Fixtures</a></li><li><a href="https://ZarleyLtd.github.io/CrossGunsSnooker/results.html" class="al" target="_self">Results</a></li></ul></nav><div class="footer__copyright"><p><span style="color: #169179;">by JP</span></p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://ZarleyLtd.github.io/CrossGunsSnooker/assets/js/scripts.min.js?v=700105c316933a8202041b6415abb233"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'overlay',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
